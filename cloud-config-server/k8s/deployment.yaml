apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: 423671573423.dkr.ecr.us-east-1.amazonaws.com/config-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9296
