apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: department-service
  template:
    metadata:
      labels:
        app: department-service
    spec:
      containers:
        - name: department-service
          image: 423671573423.dkr.ecr.us-east-1.amazonaws.com/department-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9001
